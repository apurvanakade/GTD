{% extends "base.html" %}
{% block title %}{{ h.title }}{% endblock %}
{% block body %}
<p><a href="{{ url_for('horizons_view') }}">← Horizons</a> · <span class="hint">{{ label }}</span></p>
<form method="post" class="edit">
  <input name="title" value="{{ h.title }}" class="big" aria-label="Title" required>
  <textarea name="notes" rows="14" placeholder="{% if h.level == 'goal' %}Outcome, target date, which areas and projects it serves…{% elif h.level == 'area' %}This area is fine when… Standards, recurring responsibilities…{% endif %}">{{ h.notes }}</textarea>
  <div class="row">
    <button class="primary">Save</button>
    {% if h.level in ('goal', 'area') %}
    <button formaction="{{ url_for('horizon_delete', id=h.id) }}" class="danger" onclick="return confirm('Delete this {{ h.level }}?')">Delete</button>
    {% endif %}
  </div>
</form>
{% endblock %}
