{% extends "base.html" %}
{% block title %}{{ h.title }}{% endblock %}
{% block crumb %}<p class="crumb"><a href="{{ url_for('horizons_view', level=h.level) }}">Horizons</a> · {{ label }}</p>{% endblock %}
{% block heading %}{% endblock %}
{% block body %}
<form method="post" class="edit" data-autosave="{{ url_for('autosave', kind='horizons', id=h.id) }}">
  <button hidden>Save</button>{# the default, so Enter in the title saves #}
  <div class="title-line">
    <input name="title" value="{{ h.title }}" class="big" aria-label="Title" required>
    {% if h.level in ('goal', 'area') %}
    <button formaction="{{ url_for('horizon_delete', id=h.id) }}" class="icon danger" title="Delete" aria-label="Delete" onclick="return confirm('Delete this {{ h.level }}?')">✕</button>
    {% endif %}
  </div>
  <textarea name="notes" rows="14" placeholder="{% if h.level == 'goal' %}Outcome, target date…{% elif h.level == 'area' %}This area is fine when… Standards, recurring responsibilities…{% endif %}">{{ h.notes }}</textarea>
  <p class="autosave hint" aria-live="polite"></p>
</form>
{% endblock %}
