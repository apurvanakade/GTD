{% extends "base.html" %}
{% from "_task.html" import row with context %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<h1>{{ title }}</h1>
{% if tasks %}
<ul class="tasks">{% for t in tasks %}{{ row(t, context=True) }}{% endfor %}</ul>
{% else %}
<p class="empty">{{ empty }}</p>
{% endif %}
{% endblock %}
