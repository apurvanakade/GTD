{% extends "base.html" %}
{% block title %}Someday / maybe{% endblock %}
{% block body %}
<h1>Someday / maybe</h1>
<ul class="tasks">
  {% for p in projects %}
  <li class="task">
    <a class="title" href="{{ url_for('project_view', id=p.id) }}">{{ p.title }}</a>
    <span class="meta">{{ p.open_count }} open</span>
    <form method="post" action="{{ url_for('project_view', id=p.id) }}"><input type="hidden" name="title" value="{{ p.title }}"><input type="hidden" name="notes" value="{{ p.notes }}"><button name="status" value="active">Activate</button></form>
  </li>
  {% else %}
  <li class="empty">Nothing parked here.</li>
  {% endfor %}
</ul>
{% endblock %}
