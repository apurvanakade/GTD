[project]
name = "gtd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = ["browser: drives real Chromium via Playwright (slow); run with -m browser"]
addopts = "-m 'not browser' -n auto"
